<VirtualHost *:80>
    ServerName ownly.torras.ai
    DocumentRoot /var/www/ownly-acme
    <Directory /var/www/ownly-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/ownly-error.log
    CustomLog ${APACHE_LOG_DIR}/ownly-access.log combined
</VirtualHost>
