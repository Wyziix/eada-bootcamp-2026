<VirtualHost *:80>
    ServerName ownly.torras.ai
    DocumentRoot /var/www/ownly-acme
    <Directory /var/www/ownly-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RedirectMatch permanent "^/(?!\.well-known/acme-challenge/)(.*)$" "https://ownly.torras.ai/$1"
    ErrorLog ${APACHE_LOG_DIR}/ownly-error.log
    CustomLog ${APACHE_LOG_DIR}/ownly-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName ownly.torras.ai
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ownly.torras.ai/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ownly.torras.ai/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    ProxyPass / http://127.0.0.1:8850/ connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:8850/
    LimitRequestBody 1048576
    Header always set X-Content-Type-Options "nosniff"
    ErrorLog ${APACHE_LOG_DIR}/ownly-error.log
    CustomLog ${APACHE_LOG_DIR}/ownly-access.log combined
</VirtualHost>
